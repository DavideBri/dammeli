<!--
	Source for public/og-image.png. Not part of the build (no bundler, no
	JS dependency) — this is the static HTML/CSS mockup used to render that
	image once, by hand: open this file in a browser, size the viewport to
	exactly 1200x630 (devtools' device toolbar can set a custom size), and
	screenshot it. The logo mark SVG below is copy-pasted from
	src/vendor/marks.mjs's logoMarkSvg() output — if that mark changes,
	re-copy its <svg>...</svg> output here too before re-rendering, so the
	OG image never drifts from the real UI.
-->
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<style>
	* { margin: 0; padding: 0; box-sizing: border-box; }
	html, body { width: 1200px; height: 630px; overflow: hidden; }
	body {
		font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
		background: #F7F2E9;
		display: flex;
		align-items: center;
		justify-content: center;
	}
	.stack {
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 28px;
	}
	.wordmark {
		font-size: 110px;
		font-weight: 800;
		letter-spacing: -0.03em;
		color: #1A1714;
		line-height: 1;
	}
	.wordmark .dot { color: #D14A2B; }
</style>
</head>
<body>
	<div class="stack">
		<svg width="150" height="150" viewBox="0 0 64 64" fill="none" aria-hidden="true" focusable="false">
<g stroke="#1A1714" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
<g transform="rotate(-15 32 26)">
<rect x="7" y="16" width="50" height="22" rx="3" fill="#D14A2B"></rect>
<rect x="11" y="9" width="43" height="24" rx="3" fill="#E2694B"></rect>
<circle cx="32" cy="17" r="3.8" fill="#FFFDF8"></circle>
</g>
<path d="M12 34a6 6 0 0 1 12 0 6 6 0 0 1 12 0 6 6 0 0 1 12 0v18a6 6 0 0 1-6 6H18a6 6 0 0 1-6-6V34Z" fill="#FFFDF8"></path>
<g stroke-width="2.4"><path d="M24 36.5v7M36 36.5v7"></path></g>
<path d="M16 40h18a6 6 0 0 1 0 12H16a6 6 0 0 1 0-12Z" fill="#FFFDF8" transform="rotate(-9 25 46)"></path>
</g>
</svg>
		<div class="wordmark">dammeli<span class="dot">.</span></div>
	</div>
</body>
</html>
