<!--
	Source for public/og-image.png. Not part of the build (no bundler, no
	JS dependency) — this is the static HTML/CSS mockup used to render that
	image once, by hand: open this file in a browser, size the viewport to
	exactly 1200x630 (devtools' device toolbar can set a custom size), and
	screenshot it. The method-mark SVGs below are copy-pasted from
	src/vendor/marks.mjs's methodMarkSvg()/logoMarkSvg() output — if those
	marks change, re-copy their <svg>...</svg> output here too before
	re-rendering, so the OG image never drifts from the real UI.
-->
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<style>
	@font-face { font-family: 'system'; src: local('Helvetica Neue'), local('Arial'); }
	* { margin: 0; padding: 0; box-sizing: border-box; }
	html, body { width: 1200px; height: 630px; overflow: hidden; }
	body {
		font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
		background: #F7F2E9;
		background-image:
			radial-gradient(circle at 84% 18%, #EFE8DB 0%, transparent 45%),
			radial-gradient(circle at 8% 92%, #E3DACA 0%, transparent 40%);
		display: flex;
		align-items: center;
		justify-content: center;
	}
	.card {
		width: 1104px;
		height: 534px;
		background: #FFFDF8;
		border: 3px solid #1A1714;
		border-radius: 28px;
		box-shadow: 12px 12px 0 #1A1714;
		display: flex;
		flex-direction: column;
		justify-content: space-between;
		padding: 56px 64px;
	}
	.top-row {
		display: flex;
		align-items: flex-start;
		justify-content: space-between;
	}
	.wordmark {
		font-size: 40px;
		font-weight: 800;
		letter-spacing: -0.03em;
		color: #1A1714;
	}
	.wordmark .dot { color: #D14A2B; }
	.logo-mark {
		transform: rotate(6deg);
	}
	.tagline {
		font-size: 58px;
		font-weight: 800;
		letter-spacing: -0.03em;
		line-height: 1.12;
		color: #1A1714;
		max-width: 900px;
	}
	.sub {
		margin-top: 22px;
		font-size: 27px;
		font-weight: 500;
		color: #5B534A;
		max-width: 820px;
		line-height: 1.4;
	}
	.tiles-row {
		display: flex;
		gap: 20px;
		align-items: flex-end;
	}
	.tile {
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: 10px;
	}
	.mark {
		width: 68px;
		height: 68px;
		border-radius: 16px;
		border: 2.5px solid #1A1714;
		box-shadow: 4px 4px 0 #1A1714;
		display: flex;
		align-items: center;
		justify-content: center;
		color: #1A1714;
	}
	.tile-label {
		font-size: 19px;
		font-weight: 600;
		color: #5B534A;
	}
</style>
</head>
