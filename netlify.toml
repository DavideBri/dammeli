[build]
  command = "pnpm install --frozen-lockfile && pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# 'frame-ancestors' is not honored inside a <meta> CSP (see
# astro.config.mjs): we set it here as an HTTP header instead, along with
# X-Frame-Options as a fallback for browsers that don't read
# frame-ancestors.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Frame-Options = "DENY"
